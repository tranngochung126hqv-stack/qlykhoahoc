<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin khóa học</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4" style="max-width:800px"><a href="/courses" class="btn btn-outline-secondary mb-3">← Danh sách</a><div class="card shadow-sm"><div class="card-header bg-primary text-white"><h3 class="mb-0" th:text="${course.id == null ? 'Thêm khóa học' : 'Sửa khóa học'}"></h3></div><div class="card-body"><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:object="${course}" th:action="${course.id == null ? '/courses/create' : '/courses/' + course.id + '/edit'}"><div class="mb-3"><label class="form-label">Tên khóa học</label><input class="form-control" th:field="*{name}"><div class="text-danger" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">Học phí</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{tuitionFee}"><div class="text-danger" th:errors="*{tuitionFee}"></div></div><div class="mb-3"><label class="form-label">Thời lượng (giờ)</label><input class="form-control" type="number" min="1" th:field="*{duration}"><div class="text-danger" th:errors="*{duration}"></div></div><div class="mb-3"><label class="form-label">Loại khóa học</label><select class="form-select" name="categoryId" required><option value="">-- Chọn loại khóa học --</option><option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${course.courseCategory != null and course.courseCategory.id == cat.id or categoryId != null and categoryId == cat.id}"></option></select><div class="text-danger" th:errors="*{courseCategory}"></div></div><div class="mb-3"><label class="form-label">Trạng thái</label><select class="form-select" th:field="*{isActive}"><option th:value="true">Đang tuyển sinh</option><option th:value="false">Ngừng tuyển sinh</option></select></div><div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div><button class="btn btn-primary" type="submit">Lưu</button> <a class="btn btn-secondary" href="/courses">Hủy</a></form></div></div></main></body></html>
