<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản lý khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><a class="navbar-brand" href="/courses">Quản lý khóa học</a><a
                class="btn btn-light btn-sm" href="/categories">Quản lý loại khóa học</a></div>
    </nav>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Danh sách khóa học</h2><a class="btn btn-success" href="/courses/create">+ Thêm khóa học</a>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${filterError}" class="alert alert-warning" th:text="${filterError}"></div>
        <form class="card card-body mb-4" method="get" action="/courses">
            <div class="row g-3">
                <div class="col-md-4"><label class="form-label">Tên khóa học</label><input class="form-control"
                        name="keyword" placeholder="Nhập tên cần tìm" th:value="${keyword}"></div>
                <div class="col-md-3"><label class="form-label">Loại khóa học</label><select class="form-select"
                        name="categoryId">
                        <option value="">Tất cả loại</option>
                        <option th:each="cat:${categories}" th:value="${cat.id}" th:text="${cat.name}"
                            th:selected="${categoryId == cat.id}"></option>
                    </select></div>
                <div class="col-md-2"><label class="form-label">Trạng thái</label><select class="form-select"
                        name="status">
                        <option value="">Tất cả</option>
                        <option value="true" th:selected="${status == 'true'}">Đang tuyển sinh</option>
                        <option value="false" th:selected="${status == 'false'}">Ngừng tuyển sinh</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label">Sắp xếp</label><select class="form-select" name="order">
                        <option value="" th:selected="${order == ''}">Mặc định</option>
                        <option value="feeAsc" th:selected="${order == 'feeAsc'}">Học phí tăng dần</option>
                        <option value="feeDesc" th:selected="${order == 'feeDesc'}">Học phí giảm dần</option>
                        <option value="durationAsc" th:selected="${order == 'durationAsc'}">Thời lượng tăng dần</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label">Học phí tối thiểu</label><input class="form-control"
                        type="number" min="0" step="0.01" name="minFee" th:value="${minFee}"></div>
                <div class="col-md-3"><label class="form-label">Học phí tối đa</label><input class="form-control"
                        type="number" min="0" step="0.01" name="maxFee" th:value="${maxFee}"></div>
                <div class="col-md-6 d-flex align-items-end gap-2"><button class="btn btn-primary" type="submit">Tìm
                        kiếm / Lọc</button><a class="btn btn-outline-secondary" href="/courses">Xóa bộ lọc</a></div>
            </div>
        </form>
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle bg-white">
                <thead class="table-primary">
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên khóa học</th>
                        <th>Loại khóa học</th>
                        <th>Học phí</th>
                        <th>Thời lượng</th>
                        <th>Phân loại</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c:${courses}">
                        <td style="width:100px"><img th:if="${c.thumbnail != null}" th:src="${c.thumbnail.imageUrl}"
                                alt="Ảnh khóa học" style="width:80px;height:55px;object-fit:cover"><span
                                th:if="${c.thumbnail == null}">Chưa có ảnh</span></td>
                        <td th:text="${c.name}"></td>
                        <td th:text="${c.courseCategory.name}"></td>
                        <td th:text="${#numbers.formatDecimal(c.tuitionFee,1,'COMMA',0,'POINT')} + ' đ'"></td>
                        <td th:text="${c.duration} + ' giờ'"></td>
                        <td><span class="badge text-bg-info" th:text="${c.durationType}"></span></td>
                        <td><span th:if="${c.isActive}" class="badge text-bg-success">Đang tuyển sinh</span><span
                                th:unless="${c.isActive}" class="badge text-bg-secondary">Ngừng tuyển sinh</span></td>
                        <td class="text-nowrap"><a class="btn btn-sm btn-info"
                                th:href="@{/courses/{id}(id=${c.id})}">Chi tiết</a> <a class="btn btn-sm btn-warning"
                                th:href="@{/courses/{id}/edit(id=${c.id})}">Sửa</a>
                            <form class="d-inline" method="post" th:action="@{/courses/{id}/delete(id=${c.id})}"
                                onsubmit="return confirm('Bạn có chắc muốn xóa khóa học này?')"><button
                                    class="btn btn-sm btn-danger">Xóa</button></form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="8" class="text-center py-4">Không tìm thấy khóa học phù hợp.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
