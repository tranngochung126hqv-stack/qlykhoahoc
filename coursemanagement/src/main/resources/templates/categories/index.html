<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loại khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-4"><a href="/courses" class="btn btn-outline-secondary mb-3">← Danh sách khóa học</a>
        <h2 class="mb-3">Quản lý loại khóa học</h2>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="card mb-4">
            <div class="card-header">Thêm loại khóa học</div>
            <div class="card-body">
                <form method="post" th:action="@{/categories}" th:object="${category}">
                    <div class="mb-3"><label class="form-label">Tên loại</label><input class="form-control"
                            th:field="*{name}" required>
                        <div class="text-danger" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Mô tả</label><textarea class="form-control"
                            th:field="*{description}"></textarea></div><button class="btn btn-primary">Thêm
                        loại</button>
                </form>
            </div>
        </div>
        <table class="table table-bordered bg-white">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Tên loại</th>
                    <th>Mô tả</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat:${categories}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.name}"></td>
                    <td th:text="${cat.description}"></td>
                    <td>
                        <form method="post" th:action="@{/categories/{id}/delete(id=${cat.id})}"
                            onsubmit="return confirm('Bạn có chắc muốn xóa loại này?')"><button
                                class="btn btn-danger btn-sm">Xóa</button></form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
