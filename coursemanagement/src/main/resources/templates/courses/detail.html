<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chi tiết khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-4"><a href="/courses" class="btn btn-outline-secondary mb-3">← Danh sách</a>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="card mb-4">
            <div class="card-body">
                <h2 th:text="${course.name}"></h2>
                <p><b>Loại khóa học:</b> <span th:text="${course.courseCategory.name}"></span></p>
                <p><b>Học phí:</b> <span
                        th:text="${#numbers.formatDecimal(course.tuitionFee,1,'COMMA',0,'POINT')} + ' đ'"></span></p>
                <p><b>Thời lượng:</b> <span th:text="${course.duration} + ' giờ (' + course.durationType + ')'"></span>
                </p>
                <p><b>Trạng thái:</b> <span
                        th:text="${course.isActive ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'}"></span></p>
                <p><b>Mô tả:</b> <span th:text="${course.description}"></span></p>
            </div>
        </div>
        <h3>Ảnh khóa học</h3>
        <div class="row g-3 mb-4">
            <div class="col-md-4" th:each="img:${course.images}">
                <div class="card h-100"><img th:src="${img.imageUrl}" class="card-img-top"
                        style="height:200px;object-fit:cover" alt="Ảnh khóa học">
                    <div class="card-body"><span th:if="${img.isThumbnail}" class="badge text-bg-success">Ảnh đại
                            diện</span><span th:unless="${img.isThumbnail}" class="badge text-bg-secondary">Ảnh
                            thường</span>
                        <form th:if="${!img.isThumbnail}" method="post"
                            th:action="@{/courses/{id}/images/{imageId}/thumbnail(id=${course.id},imageId=${img.id})}"
                            class="mt-2"><button class="btn btn-sm btn-primary">Chọn làm ảnh đại diện</button></form>
                        <form method="post"
                            th:action="@{/courses/{id}/images/{imageId}/delete(id=${course.id},imageId=${img.id})}"
                            class="mt-2" onsubmit="return confirm('Xóa ảnh này?')"><button
                                class="btn btn-sm btn-danger">Xóa ảnh</button></form>
                    </div>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(course.images)}">Khóa học chưa có ảnh.</p>
        </div>
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Thêm ảnh bằng URL</h4>
            </div>
            <div class="card-body">
                <form method="post" th:action="@{/courses/{id}/images(id=${course.id})}">
                    <div class="mb-3"><label class="form-label">Đường dẫn ảnh</label><input class="form-control"
                            name="imageUrl" type="url" required maxlength="1000"
                            placeholder="https://example.com/image.jpg"></div>
                    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="thumbnail"
                            value="true" id="thumbnail"><label class="form-check-label" for="thumbnail">Đặt làm ảnh đại
                            diện</label></div><button class="btn btn-success">Thêm ảnh</button>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
